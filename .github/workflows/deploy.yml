# ============================================
# Automatic deployment of Frontend + Backend (cPanel)
# Asociația Green Space
#
# Runs on every push to `main` that touches frontend/ or backend/
# and deploys automatically to the production cPanel host via SSH:
#   - Frontend (React/Vite)  -> public_html (asociatiagreenspace.ro)
#   - Backend  (Node/Express/Passenger) -> /home/asocia17/api-gs
#
# One-time setup (required before first run):
#   Settings -> Secrets and variables -> Actions -> New repository secret:
#     CPANEL_SSH_KEY        (private SSH key, multiline| -> enables deploy
#   Optional secrets/variables (used when set; production-safe defaults otherwise|:
#     CPANEL_SSH_USER, CPANEL_SSH_HOST, CPANEL_SSH_PORT
#     CPANEL_FE_PATH, CPANEL_BE_PATH
#     SMTP_USER, SMTP_PASS, ADMIN_EMAIL, EMAIL_FROM
#     FIREBASE_DATABASE_URL, FIREBASE_SERVICE_ACCOUNT (multiline JSON|
#     VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_DATABASE_URL,
#     VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
#     VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
#
# See DEPLOY_AUTOMAT.md for full instructions and rollback.
# ============================================

name: Deploy FE & BE

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # BUILD FRONTEND
      # ============================================
      - name: Configure frontend environment
        shell: bash
        run: |
          cat > frontend/.env.production <<'ENV_EOF'
          # Generated by GitHub Actions - do not commit
          VITE_NODE_ENV=production
          VITE_BACKEND_URL=https://api.asociatiagreenspace.ro
          VITE_PORT=5000
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY || 'demo-api-key' }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'demo-project.firebaseapp.com' }}
          VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL || 'https://demo-project-default-rtdb.firebaseio.com' }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID || 'demo-project' }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'demo-project.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID || '1:123456789:web:abcdef123456' }}
          ENV_EOF
          if [ -n "${{ secrets.VITE_FIREBASE_API_KEY }}" ]; then
            echo "::notice::Frontend built with real Firebase configuration."
          else
            echo "::warning::VITE_FIREBASE_* secrets not set. Frontend will use demo Firebase fallbacks. Set the secrets to keep admin/auth working in production."
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add .htaccess (SPA rewrite, security headers)
        shell: bash
        run: |
          if [ -f frontend/htaccess-pentru-cpanel.txt ]; then
            cp frontend/htaccess-pentru-cpanel.txt frontend/dist/.htaccess
          else
            cat > frontend/dist/.htaccess <<'HTACCESS_EOF'
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteBase /
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          </IfModule>
          Options -Indexes
          HTACCESS_EOF
          fi
          echo "dist size: $(du -sh frontend/dist | cut -f1)"

      # ============================================
      # CONFIGURE + PACKAGE BACKEND
      # ============================================
      # The generated .env (from secrets) is bundled with the app.
      # The server's .htaccess (Passenger config) is deliberately excluded
      # so the live cPanel/CloudLinux configuration is never clobbered.
      - name: Configure backend environment (.env)
        shell: bash
        run: |
          cat > backend/.env <<'ENV_EOF'
          # Generated by GitHub Actions - do not commit
          NODE_ENV=production
          PORT=5000
          FRONTEND_URL=https://asociatiagreenspace.ro
          BACKEND_URL=https://api.asociatiagreenspace.ro
          SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE=${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL || 'contact@asociatiagreenspace.ro' }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM || 'noreply@asociatiagreenspace.ro' }}
          FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENV_EOF

      - name: Package backend
        shell: bash
        run: |
          mkdir -p deploy-artifacts
          tar -czf deploy-artifacts/greenspace-backend-${GITHUB_SHA:0:8}.tar.gz \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./node_modules/*' \
            --exclude='./data' \
            --exclude='./data/*' \
            --exclude='./logs' \
            --exclude='./logs/*' \
            --exclude='./tmp' \
            --exclude='./tmp/*' \
            --exclude='./deploy' \
            --exclude='./deploy/*' \
            --exclude='./.env.local' \
            --exclude='./.env.development' \
            --exclude='./.env.production' \
            --exclude='./.htaccess' \
            --exclude='./*.log' \
            --exclude='./.DS_Store' \
            -C backend .
          ls -lh deploy-artifacts/
          tar -tzf deploy-artifacts/greenspace-backend-${GITHUB_SHA:0:8}.tar.gz | grep -c '^\./\.env$' \
            && echo "::notice::backend/.env included in bundle" \
            || echo "::warning::backend/.env missing from bundle!"

      # ============================================
      # DEPLOY TO CPANEL
      # ============================================
      - name: Install SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.CPANEL_SSH_KEY }}" ]; then
            echo "::error::CPANEL_SSH_KEY secret is not set. Add it in Settings -> Secrets -> Actions to enable automatic deployment."
            echo ${{ secrets.CPANEL_SSH_KEY }}
            exit 1
          fi
          cat > ~/.ssh/id_deploy <<'KEY_EOF'
          ${{ secrets.CPANEL_SSH_KEY }}
          KEY_EOF
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_deploy

      - name: Deploy backend (Passenger app)
        shell: bash
        env:
          SSH_USER: ${{ secrets.CPANEL_SSH_USER || 'asocia17' }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST || 'asociatiagreenspace.ro' }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          BE_PATH: ${{ secrets.CPANEL_BE_PATH || '/home/asocia17/api-gs' }}
          SSH_KEY: ${{ runner.home }}/.ssh/id_deploy
        run: |
          set -e
          SSH_OPTS="-i $SSH_KEY -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          TARBALL=deploy-artifacts/greenspace-backend-${GITHUB_SHA:0:8}.tar.gz

          echo "::group::Uploading backend bundle"
          scp $SSH_OPTS "$TARBALL" "$SSH_USER@$SSH_HOST:/tmp/greenspace-backend.tar.gz"
          echo "::endgroup::"

          echo "::group::Extracting backend on server"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "bash -s -- \"$BE_PATH\"" <<'REMOTE_EOF'
          set -e
          cd "${1:-/home/asocia17/api-gs}"
          echo "→ Backup existing backend..."
          tar -czf backup-$(date +%Y%m%d-%H%M%S)).tar.gz --exclude='node_modules' --exclude='node_modules/*' --exclude='data' --exclude='data/*' --exclude='logs' --exclude='logs/*' --exclude='tmp' --exclude='tmp/*' --exclude='deploy' --exclude='deploy/*' --exclude='.env' --exclude='.htaccess' . 2>/dev/null || true
          echo "→ Extracting new version..."
          tar -xzf /tmp/greenspace-backend.tar.gz
          rm -f /tmp/greenspace-backend.tar.gz
          echo "→ Installing production dependencies..."
          NPM_CMD=$(command -v npm || echo /home/asocia17/nodevenv/api-gs/18/bin/npm)
          "$NPM_CMD" install --production --no-audit --no-fund 2>&1 || "$NPM_CMD" install --production 2>&1
          echo "→ Restarting Passenger app..."
          mkdir -p tmp
          touch tmp/restart.txt
          echo "✅ Backend deployed. Waiting for restart..."
          REMOTE_EOF
          echo "::endgroup::"

          # Health check with retry (Passenger restart takes 10-30s)
          echo "::group::Backend health check"
          for i in $(seq 1 15); do
            if curl -fsS "https://api.asociatiagreenspace.ro/health" >/dev/null 2>&1; then
              echo "✅ Backend healthy after ${i} attempt(s)"
              curl -s "https://api.asociatiagreenspace.ro/health"
              echo ""
              break
            fi
            echo "Waiting for backend... (${i}/15)"
            sleep 10
          done
          curl -fsS "https://api.asociatiagreenspace.ro/health" >/dev/null 2>&1 || { echo "❌ Backend health check failed"; exit 1; }
          echo "::endgroup::"

      - name: Deploy frontend (public_html)
        shell: bash
        env:
          SSH_USER: ${{ secrets.CPANEL_SSH_USER || 'asocia17' }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST || 'asociatiagreenspace.ro' }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          FE_PATH: ${{ secrets.CPANEL_FE_PATH || '/home/asocia17/asociatiagreenspace.ro/public_html' }}
          SSH_KEY: ${{ runner.home }}/.ssh/id_deploy
        run: |
          set -e
          SSH_OPTS="-i $SSH_KEY -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          echo "::group::Uploading frontend (rsync|"
          rsync -avz --delete --exclude='.git' -e "ssh $SSH_OPTS" frontend/dist/ "$SSH_USER@$SSH_HOST:$FE_PATH/"
          echo "::endgroup::"

          echo "::group::Frontend health check"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://asociatiagreenspace.ro/")
          echo "Frontend HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Frontend returned $CODE instead of 200. Check https://asociatiagreenspace.ro/"
            exit 1
          fi
          echo "✅ Frontend reachable"
          echo "::endgroup::"

      - name: Deployment summary
        shell: bash
        run: |
          echo "## ✅ Automatic deployment completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${GITHUB_SHA:0:8}\` (\`${GITHUB_REF_NAME}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** https://asociatiagreenspace.ro" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend:** https://api.asociatiagreenspace.ro/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend bundle: $(du -sh frontend/dist | cut -f1) | Backend bundle: $(du -sh deploy-artifacts | cut -f1)" >> $GITHUB_STEP_SUMMARY
