# ============================================
# Automatic deployment of Frontend + Backend (cPanel)
# Asociația Green Space
#
# Runs on every push to `main` that touches frontend/ or backend/
# and deploys automatically to the production cPanel host over FTPS:
#   - Frontend (React/Vite)             -> public_html (asociatiagreenspace.ro)
#   - Backend  (Node/Express/Passenger) -> /home/asocia17/api-gs
#
# No SSH needed: the host only has to accept FTPS logins. The workflow
# installs lftp and uses it for the upload. See
# .github/scripts/ftps-deploy.sh for the upload logic.
#
# One-time setup (required before first run):
#   Settings -> Secrets and variables -> Actions -> New repository secret:
#     FTPS_PASSWORD         (password of the cPanel FTP account) -> enables deploy
#   Optional secrets/variables (production-safe defaults otherwise):
#     FTPS_HOST (asociatiagreenspace.ro), FTPS_USER (asocia17), FTPS_PORT (21)
#     FTPS_VERIFY_CERT (no), CPANEL_FE_PATH, CPANEL_BE_PATH
#     MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD, MYSQL_DATABASE
#     SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS
#     ADMIN_EMAIL, EMAIL_FROM, CSRF_SECRET
#
# See DEPLOY_AUTOMAT.md for full instructions and rollback.
# ============================================

name: Deploy FE & BE

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ============================================
      # BUILD FRONTEND
      # ============================================
      - name: Configure frontend environment
        shell: bash
        run: |
          cat > frontend/.env.production <<'ENV_EOF'
          # Generated by GitHub Actions - do not commit
          VITE_NODE_ENV=production
          VITE_BACKEND_URL=https://api.asociatiagreenspace.ro
          VITE_PORT=5000
          ENV_EOF
          echo "Frontend backend URL: $(grep VITE_BACKEND_URL frontend/.env.production | cut -d= -f2)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add .htaccess (SPA rewrite, security headers)
        shell: bash
        run: |
          if [ -f frontend/htaccess-pentru-cpanel.txt ]; then
            cp frontend/htaccess-pentru-cpanel.txt frontend/dist/.htaccess
          else
            cat > frontend/dist/.htaccess <<'HTACCESS_EOF'
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteBase /
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          </IfModule>
          Options -Indexes
          HTACCESS_EOF
          fi
          echo "dist size: $(du -sh frontend/dist | cut -f1)"

      # ============================================
      # CONFIGURE + PACKAGE BACKEND
      # ============================================
      # cPanel's Passenger app runs a fixed Node runtime (see backend/.htaccess)
      # and cannot install dependencies for us without SSH, so the production
      # node_modules built here are shipped with the app. They are pure
      # JavaScript, so a CI-installed tree runs unchanged on the server's Node.
      - name: Configure backend environment (.env)
        shell: bash
        run: |
          cat > backend/.env <<'ENV_EOF'
          # Generated by GitHub Actions - do not commit
          NODE_ENV=production
          PORT=5000
          FRONTEND_URL=https://asociatiagreenspace.ro
          BACKEND_URL=https://api.asociatiagreenspace.ro
          SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE=${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL || 'contact@asociatiagreenspace.ro' }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM || 'noreply@asociatiagreenspace.ro' }}
          MYSQL_HOST=${{ secrets.MYSQL_HOST || 'localhost' }}
          MYSQL_PORT=${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          CSRF_SECRET=${{ secrets.CSRF_SECRET }}
          MAX_FILE_SIZE=${{ secrets.MAX_FILE_SIZE || '10485760' }}
          MAX_VIDEO_SIZE=${{ secrets.MAX_VIDEO_SIZE || '104857600' }}
          ALLOWED_FILE_TYPES=${{ secrets.ALLOWED_FILE_TYPES || 'image/jpeg,image/jpg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime,video/x-msvideo,video/mpeg' }}
          ENV_EOF

      - name: Stage backend (sources + production dependencies)
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail

          # The server keeps .env, data/, logs/ and CloudLinux's .htaccess; only
          # code (including the data-seed fixtures) and dependencies are staged.
          STAGE="$RUNNER_TEMP/backend-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          tar -c \
            --exclude='./node_modules' \
            --exclude='./data' \
            --exclude='./logs' \
            --exclude='./tmp' \
            --exclude='./deploy' \
            --exclude='./.env.local' \
            --exclude='./.env.development' \
            --exclude='./.env.production' \
            --exclude='./.htaccess' \
            --exclude='./*.log' \
            --exclude='./.DS_Store' \
            . | tar -x -C "$STAGE"

          cp package.json package-lock.json "$STAGE/"
          npm ci --omit=dev --no-audit --no-fund --prefix "$STAGE"

          echo "staged files: $(find "$STAGE" -type f | wc -l)"
          echo "staged size:  $(du -sh "$STAGE" | cut -f1)"
          du -sh "$STAGE/node_modules" | awk '{print "node_modules size: "$1}'
          test -f "$STAGE/.env" && echo "::notice::backend/.env staged for upload"

      # ============================================
      # DEPLOY TO CPANEL (FTPS)
      # ============================================
      - name: Check FTPS credentials
        shell: bash
        env:
          FTPS_PASSWORD: "${{ secrets.FTPS_PASSWORD }}"
        run: |
          if [ -z "$FTPS_PASSWORD" ]; then
            echo "::error::FTPS_PASSWORD secret is not set. Add it in Settings -> Secrets and variables -> Actions to enable automatic deployment."
            exit 1
          fi
          echo "FTPS_PASSWORD is available"

      # Recent ubuntu runner images no longer ship lftp, so install it here.
      - name: Install lftp
        shell: bash
        run: |
          if command -v lftp >/dev/null 2>&1; then
            echo "lftp already available: $(lftp --version | head -1)"
            exit 0
          fi
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp
          lftp --version | head -1

      - name: Inspect remote FTPS state (temporary diagnostic)
        shell: bash
        env:
          FTPS_PASSWORD: "${{ secrets.FTPS_PASSWORD }}"
          FTPS_HOST: ${{ secrets.FTPS_HOST || 'asociatiagreenspace.ro' }}
          FTPS_USER: ${{ secrets.FTPS_USER || 'asocia17' }}
          FTPS_PORT: ${{ secrets.FTPS_PORT || '21' }}
          REMOTE_PATH: ${{ secrets.CPANEL_BE_PATH || 'api-gs' }}
        run: |
          export LFTP_PASSWORD="$FTPS_PASSWORD"
          BASE="set cmd:fail-exit no; set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true"
          probe() { lftp -c "$BASE; open --env-password -u '$FTPS_USER' ftp://$FTPS_HOST:$FTPS_PORT; $1" 2>&1 || true; }
          echo "=== home listing ==="
          probe "ls -l"
          echo "=== target listing [$REMOTE_PATH] ==="
          probe "ls -l '$REMOTE_PATH'"
          echo "=== cwd target ==="
          probe "cd '$REMOTE_PATH' && pwd || echo CWD_TARGET_FAILED"
          echo "=== cwd node_modules ==="
          probe "cd '$REMOTE_PATH/node_modules' && pwd || echo CWD_NODE_MODULES_FAILED"
          echo "=== chmod/type probe: rmdir a fresh dir then mkdir again ==="
          probe "cd '$REMOTE_PATH' && mkdir _probe_gs && echo MKD_OK || echo MKD_FAIL"
          echo "=== cwd into freshly made dir ==="
          probe "cd '$REMOTE_PATH/_probe_gs' && pwd || echo CWD_PROBE_FAILED"
          echo "=== nested dir probe ==="
          probe "cd '$REMOTE_PATH/_probe_gs' && mkdir _probe_inner && cd _probe_inner && pwd || echo CWD_NESTED_FAILED"
          echo "=== cleanup probes ==="
          probe "cd '$REMOTE_PATH/_probe_gs/_probe_inner' && rmdir . 2>/dev/null; cd '$REMOTE_PATH/_probe_gs' && rmdir _probe_inner 2>/dev/null; cd '$REMOTE_PATH' && rmdir _probe_gs && echo RMDIR_OK || echo RMDIR_FAIL"
          echo "=== disk/quota-ish: try writing a probe file ==="
          probe "cd '$REMOTE_PATH' && put /etc/hostname -o _probe_gs_file && echo PUT_OK || echo PUT_FAIL"
          probe "cd '$REMOTE_PATH' && rm -f _probe_gs_file && echo RM_OK || echo RM_FAIL"
          echo "=== done ==="

      - name: Deploy backend (Passenger app)
        shell: bash
        env:
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
          FTPS_HOST: ${{ secrets.FTPS_HOST || 'asociatiagreenspace.ro' }}
          FTPS_USER: ${{ secrets.FTPS_USER || 'asocia17' }}
          FTPS_PORT: ${{ secrets.FTPS_PORT || '21' }}
          FTPS_VERIFY_CERT: ${{ secrets.FTPS_VERIFY_CERT || 'no' }}
          FTPS_IMPLICIT: ${{ secrets.FTPS_IMPLICIT || 'false' }}
          REMOTE_PATH: ${{ secrets.CPANEL_BE_PATH || 'api-gs' }}
          LOCAL_DIR: ${{ runner.temp }}/backend-stage
        run: ./.github/scripts/ftps-deploy.sh backend

      - name: Deploy frontend (public_html)
        shell: bash
        env:
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
          FTPS_HOST: ${{ secrets.FTPS_HOST || 'asociatiagreenspace.ro' }}
          FTPS_USER: ${{ secrets.FTPS_USER || 'asocia17' }}
          FTPS_PORT: ${{ secrets.FTPS_PORT || '21' }}
          FTPS_VERIFY_CERT: ${{ secrets.FTPS_VERIFY_CERT || 'no' }}
          FTPS_IMPLICIT: ${{ secrets.FTPS_IMPLICIT || 'false' }}
          REMOTE_PATH: ${{ secrets.CPANEL_FE_PATH || 'asociatiagreenspace.ro/public_html' }}
          LOCAL_DIR: frontend/dist
        run: ./.github/scripts/ftps-deploy.sh frontend

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Backend health check"
          # Passenger restarts on the next request after tmp/restart.txt moves,
          # which takes a few seconds; retry instead of failing instantly.
          backend_ok=false
          for i in $(seq 1 15); do
            if curl -fsS "https://api.asociatiagreenspace.ro/health" >/dev/null 2>&1; then
              echo "Backend healthy after ${i} attempt(s)"
              curl -s "https://api.asociatiagreenspace.ro/health"
              echo ""
              backend_ok=true
              break
            fi
            echo "Waiting for backend... (${i}/15)"
            sleep 10
          done
          if [ "$backend_ok" != "true" ]; then
            echo "::error::Backend health check failed"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Frontend check"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://asociatiagreenspace.ro/")
          echo "Frontend HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Frontend returned $CODE instead of 200"
            exit 1
          fi
          echo "Frontend reachable"
          echo "::endgroup::"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Automatic deployment (FTPS)"
            echo ""
            echo "- **Commit:** \`${GITHUB_SHA:0:8}\` (\`${GITHUB_REF_NAME}\`)"
            echo "- **Frontend:** https://asociatiagreenspace.ro"
            echo "- **Backend:** https://api.asociatiagreenspace.ro/health"
            echo "- **Transport:** FTPS (lftp), no SSH"
          } >> "$GITHUB_STEP_SUMMARY"